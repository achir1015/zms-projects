[project]
name = "zms-projects"
version = "1.3.1"
description = "資料助秘專案彙整"
authors = [{ name = "吳玉柱" }]
requires-python = ">=3.10"
# 手機 App（flet build ipa／apk）用；電腦版另見 tools/build_windows.py、tools/build_macos.sh（另需 qrcode、pillow、flet-web）
dependencies = ["flet==1.1.2", "flet-audio==1.1.2", "pymysql>=1.1", "certifi"]

[tool.flet]
org = "com.achir"
product = "資料助秘專案彙整"
company = "吳玉柱"
copyright = "© 2026 吳玉柱"

[tool.flet.app]
path = "."
exclude = ["tests", "tools", "packaging", "data", ".venv", "dist", "dist-installer", "build", "docs", "run_web.py",
           "*.spec", "assets/icon.ico", "*.log", "dist-mac", "build-mac", "dist-android", "dist-ios", "android",
           "data_mobile", "run_web_mobile.py", "run_web_tablet.py", "*.pdf", "*.zmsgl", ".claude", "README.md", "web.log",
           "build-win.log", "build-mac.log", "build-ios.log"]

[tool.flet.deep_linking]
scheme = "zmsprojects"
host = "connect"

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.ios]
bundle_id = "com.achir.zmsprojects"
team_id = "7BN6XJ59KP"

[tool.flet.ios.info]
NSLocalNetworkUsageDescription = "連到公司電腦上的專案彙整系統"
ITSAppUsesNonExemptEncryption = false
UIRequiresFullScreen = true
UISupportedInterfaceOrientations = ["UIInterfaceOrientationPortrait"]
"UISupportedInterfaceOrientations~ipad" = ["UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
