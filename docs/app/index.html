<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案彙整線上版</title>
<meta name="description" content="資料助秘專案彙整線上版：GitHub 專案的主題、說明、最新版本、下載、App Store／Play／影片／線上版連結、分類與六平台進度。">
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#F2F5FA;--card:#fff;--ink:#1F2937;--muted:#64748B;--line:#E2E8F0;--primary:#1E4D8C;--navy:#13294B;
  --teal:#0FA294;--gold:#E0A526;--soft:#F7F9FC;--hl:#FFF8E6;--shadow:0 1px 2px #0f172a0d,0 6px 18px #0f172a0f;
  --t-blue:#E3EDFB;--f-blue:#1E4D8C;--t-teal:#DDF5F1;--f-teal:#0F766E;--t-amber:#FDF1D8;--f-amber:#B45309;
  --t-violet:#EDE7FB;--f-violet:#6D28D9;--t-green:#DCF5E6;--f-green:#15803D;--t-rose:#FCE4E8;--f-rose:#BE123C;
  --t-slate:#E7ECF2;--f-slate:#475569;--t-sky:#DDF0FB;--f-sky:#0369A1;--t-orange:#FDE9DA;--f-orange:#C2410C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F172A;--card:#162033;--ink:#E5E7EB;--muted:#94A3B8;--line:#26324A;--primary:#7FB0F0;--soft:#1B2740;--hl:#3A2F12;--shadow:none;
  --t-blue:#1C2D4A;--t-teal:#123532;--t-amber:#3A2E14;--t-violet:#2A2145;--t-green:#14321F;--t-rose:#3B1A23;--t-slate:#222C3D;--t-sky:#13304A;--t-orange:#3A2414;
  --f-blue:#9CC2F5;--f-teal:#5EE0CF;--f-amber:#F5C66B;--f-violet:#C4B0FA;--f-green:#7EE0A2;--f-rose:#F7A0B2;--f-slate:#B8C4D4;--f-sky:#8BCFF5;--f-orange:#F7B184;}}
:root[data-theme="dark"]{
  --bg:#0F172A;--card:#162033;--ink:#E5E7EB;--muted:#94A3B8;--line:#26324A;--primary:#7FB0F0;--soft:#1B2740;--hl:#3A2F12;--shadow:none;
  --t-blue:#1C2D4A;--t-teal:#123532;--t-amber:#3A2E14;--t-violet:#2A2145;--t-green:#14321F;--t-rose:#3B1A23;--t-slate:#222C3D;--t-sky:#13304A;--t-orange:#3A2414;
  --f-blue:#9CC2F5;--f-teal:#5EE0CF;--f-amber:#F5C66B;--f-violet:#C4B0FA;--f-green:#7EE0A2;--f-rose:#F7A0B2;--f-slate:#B8C4D4;--f-sky:#8BCFF5;--f-orange:#F7B184;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.55}
a{color:var(--primary)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;
  display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";-webkit-font-smoothing:antialiased;vertical-align:middle}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px}
/* 頂部 */
header.top{background:linear-gradient(135deg,#13294B,#1E4D8C 55%,#0F766E);color:#fff}
.bar{display:flex;align-items:center;gap:14px;padding:16px 0}
.bar img{width:46px;height:46px;border-radius:12px;flex:none}
.bar h1{margin:0;font-size:20px;font-weight:800;line-height:1.2}
.bar .sub{color:#C8D7EE;font-size:13px}
.bar .grow{flex:1;min-width:0}
.ibtn{all:unset;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;
  cursor:pointer;background:#ffffff1f;border:1px solid #ffffff38;color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.ibtn:hover{background:#ffffff30}
.ibtn:focus-visible,.btn:focus-visible,.tab:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.kpis{display:flex;gap:10px;overflow-x:auto;padding:0 0 16px;scrollbar-width:none}
.kpi{flex:none;background:#ffffff14;border:1px solid #ffffff26;border-radius:12px;padding:8px 14px;min-width:110px}
.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:#C8D7EE}
/* 工具列 */
.tools{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.row1{display:flex;gap:10px;align-items:center;padding:12px 0 8px;flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;height:42px}
.search input{all:unset;flex:1;min-width:0}
.sel{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{all:unset;cursor:pointer;height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;font-weight:700}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0F172A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0F172A}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:8px}
.chipbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:16px;
  border:1px solid var(--line);background:var(--card);font-size:13px}
.chipbtn[aria-pressed="true"]{background:var(--t-blue);color:var(--f-blue);border-color:transparent;font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
.tab{all:unset;cursor:pointer;flex:none;padding:10px 14px;border-bottom:3px solid transparent;font-size:14px;color:var(--muted);white-space:nowrap}
.tab .n{font-size:12px;margin-left:4px;opacity:.8}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--tc,var(--primary))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* 卡片 */
main{padding:16px 0 40px}
.count{color:var(--muted);font-size:13px;margin:0 0 10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s;min-width:0}
.pcard:hover{transform:translateY(-2px);border-color:var(--primary)}
.pcard:focus-visible{outline:2px solid var(--gold)}
.ph{display:flex;gap:12px;align-items:flex-start}
.av{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:contain;display:block}
.dh .av{width:48px;height:48px}
.pt{min-width:0;flex:1}
.pt h3{margin:0;font-size:16px;line-height:1.35;font-weight:800;overflow-wrap:anywhere}
.pt .nm{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--t-slate);color:var(--f-slate);white-space:nowrap}
.tag .ms{font-size:14px}
.plats{display:flex;gap:4px;flex-wrap:wrap}
.pl{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--muted);opacity:.55;letter-spacing:.3px}
.pl.s4{background:var(--t-green);color:var(--f-green);opacity:1}
.pl.s3{background:var(--t-violet);color:var(--f-violet);opacity:1}
.pl.s2{background:var(--t-amber);color:var(--f-amber);opacity:1}
.pl.s1{background:var(--t-sky);color:var(--f-sky);opacity:1}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.lk{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:9px;text-decoration:none;
  border:1px solid var(--line);color:var(--ink);background:var(--card)}
.lk:hover{border-color:var(--primary)}
.lk .ms{font-size:16px}
.lk.vid{background:#DC2626;color:#fff;border-color:#DC2626}
.lk.app{color:var(--f-blue)}.lk.play{color:var(--f-green)}.lk.web{color:var(--f-teal)}.lk.dl{color:var(--f-violet)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
/* 平台總表 */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 220px)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--soft);z-index:1;font-weight:700;color:var(--muted)}
td.t{white-space:normal;min-width:220px;cursor:pointer}
td.t b{display:block}
td.t span{font-size:12px;color:var(--muted)}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px}
.st.s4{background:var(--t-green);color:var(--f-green)}.st.s3{background:var(--t-violet);color:var(--f-violet)}
.st.s2{background:var(--t-amber);color:var(--f-amber)}.st.s1{background:var(--t-sky);color:var(--f-sky)}
.st.s0,.st.s9{color:var(--muted)}
/* 明細 */
dialog{border:none;padding:0;border-radius:20px;width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--card);color:var(--ink);
  box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0f172a99}
.dh{position:sticky;top:0;background:var(--card);display:flex;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);z-index:2}
.dh h2{margin:0;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.dh .nm{font-size:12.5px;color:var(--muted)}
.xbtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.xbtn:hover{background:var(--soft)}
.db{padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px}
.db h4{margin:0 0 8px;font-size:15px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.ptable td,.ptable th{white-space:normal}
.assets a{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);margin-bottom:6px}
.assets a span{color:var(--muted);font-size:12px;white-space:nowrap}
.vids{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.vids video,.vids iframe{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;border:0}
.vids .cap{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readme{border:1px solid var(--line);border-radius:14px;padding:6px 20px;overflow-wrap:anywhere;font-size:14.5px}
.readme img,.readme video{max-width:100%;height:auto}
.readme pre{background:var(--soft);padding:12px;border-radius:10px;overflow:auto}
.readme code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.92em}
.readme pre code{padding:0;background:none}
.readme table{display:block;overflow:auto}
.readme th,.readme td{white-space:normal;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:700;text-decoration:none;border:1px solid var(--line);
  background:var(--card);color:var(--primary);cursor:pointer;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:13px;padding:10px 0 30px}
@media (max-width:640px){
  .bar h1{font-size:17px}
  .bar .sub{display:none}
  .ibtn .lbl{display:none}
  .grid{grid-template-columns:1fr}
  .kv{grid-template-columns:90px 1fr}
  .seg button .lbl{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a href="../" aria-label="回到介紹頁"><img src="../icon.png" alt=""></a>
      <div class="grow"><h1>專案彙整線上版</h1><div class="sub" id="who">載入中…</div></div>
      <button class="ibtn" id="refresh" title="從 GitHub 取得最新的星星數、說明與更新時間（不需登入）"><span class="ms">sync</span><span class="lbl">即時更新</span></button>
      <button class="ibtn" id="themeBtn" aria-label="切換深色／淺色"><span class="ms">contrast</span></button>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</header>
<div class="tools">
  <div class="wrap">
    <div class="row1">
      <label class="search"><span class="ms" aria-hidden="true">search</span><input id="q" type="search" placeholder="搜尋主題、名稱、說明、語言…" aria-label="搜尋專案"></label>
      <select class="sel" id="sort" aria-label="排序">
        <option value="pushed">最近更新</option><option value="release">最新發佈</option>
        <option value="stars">星星數</option><option value="name">名稱</option>
      </select>
      <div class="seg" role="group" aria-label="檢視方式">
        <button id="vCards" aria-pressed="true"><span class="ms">apps</span><span class="lbl">卡片</span></button>
        <button id="vMatrix" aria-pressed="false"><span class="ms">grid_view</span><span class="lbl">平台進度</span></button>
      </div>
    </div>
    <div class="chips" id="filters"></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="分類"></div>
  </div>
</div>
<main class="wrap">
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>
<footer class="wrap">資料由「資料助秘專案彙整」發佈 · <span id="gen"></span> · 系統開發：吳玉柱 先生 與 Claude AI Opus 5.5 ·
  <a href="https://github.com/achir1015/zms-projects/releases/latest">下載桌面版</a></footer>
<dialog id="dlg" aria-labelledby="dTitle"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  try { const t = localStorage.getItem("zp-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("themeBtn").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("zp-theme", root.dataset.theme); } catch (e) {}
  };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const day = s => s ? s.slice(0, 10).replace(/-/g, "/") : "";
  const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200); };
  const PL_SHORT = {WIN: "Win", MAC: "Mac", WEB: "Web", IOS: "iPhone", IPAD: "iPad", AND: "Android"};
  const TONES = ["blue","teal","amber","violet","green","rose","sky","orange"];
  const FILTERS = [["rel","有發佈版本","new_releases"],["apple","App Store","phone_iphone"],["play","Google Play","android"],
                   ["videos","有影片","smart_display"],["live","有線上版","language"]];

  let D = null, readmes = null, tab = "all", view = "cards", filters = new Set();
  let state = {q: "", sort: "pushed"};
  try { Object.assign(state, JSON.parse(sessionStorage.getItem("zp-state") || "{}")); } catch (e) {}

  function has(p, f) { return f === "rel" ? !!p.rel.tag : f === "videos" ? p.videos.length > 0 : !!p[f]; }
  function catOf(id) { return D.categories.find(c => c.id === id); }
  function toneOf(p) { return TONES[[...p.name].reduce((a, c) => a + c.charCodeAt(0), 0) % TONES.length]; }
  function vname(u, i) { return /user-attachments/.test(u) ? "README 影片 " + (i + 1) : /[?&]list=/.test(u) ? "YouTube 播放清單" : decodeURIComponent(u.split("?")[0].replace(/\/$/, "").split("/").pop()); }
  function ytid(u) { const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : ""; }

  function visible() {
    const kw = state.q.trim().toLowerCase();
    let arr = D.projects.filter(p => {
      if (tab === "none" && p.cats.length) return false;
      if (tab !== "all" && tab !== "none" && !p.cats.includes(+tab)) return false;
      for (const f of filters) if (!has(p, f)) return false;
      if (kw && ![p.title, p.name, p.heading, p.description, p.language, p.topics.join(" ")].join(" ").toLowerCase().includes(kw)) return false;
      return true;
    });
    const k = {pushed: p => p.pushed, release: p => p.rel.published || (p.rel.tag ? "0" : ""), stars: p => String(p.stars).padStart(8, "0") + p.name, name: p => p.name.toLowerCase()}[state.sort];
    arr.sort((a, b) => state.sort === "name" ? k(a).localeCompare(k(b)) : k(b).localeCompare(k(a)));
    return arr;
  }

  function kpis() {
    const ps = D.projects, n = f => ps.filter(p => has(p, f)).length;
    const items = [["專案", ps.length], ["有發佈版本", n("rel")], ["App Store", n("apple")], ["Google Play", n("play")],
                   ["有影片", n("videos")], ["有線上版", n("live")], ["分類", D.categories.length]];
    $("kpis").innerHTML = items.map(([t, v]) => `<div class="kpi"><b>${v}</b><span>${t}</span></div>`).join("");
  }

  function renderTabs() {
    const base = D.projects.filter(p => [...filters].every(f => has(p, f)));
    const cnt = id => id === "all" ? base.length : id === "none" ? base.filter(p => !p.cats.length).length : base.filter(p => p.cats.includes(id)).length;
    const tabs = [["all", "全部", ""]].concat(D.categories.map(c => [String(c.id), c.name, c.color]), [["none", "未分類", ""]]);
    $("tabs").innerHTML = tabs.map(([id, name, color]) =>
      `<button class="tab" role="tab" data-id="${id}" aria-selected="${tab === id}" style="${color ? "--tc:" + color : ""}">` +
      (color ? `<span class="dot" style="background:${color}"></span>` : "") + `${esc(name)}<span class="n">${cnt(id === "all" || id === "none" ? id : +id)}</span></button>`).join("");
    $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.id; render(); });
  }

  function renderFilters() {
    $("filters").innerHTML = FILTERS.map(([k, t, ic]) => `<button class="chipbtn" data-k="${k}" aria-pressed="${filters.has(k)}"><span class="ms" style="font-size:16px">${ic}</span>${t}</button>`).join("");
    $("filters").querySelectorAll(".chipbtn").forEach(b => b.onclick = () => { filters.has(b.dataset.k) ? filters.delete(b.dataset.k) : filters.add(b.dataset.k); render(); });
  }

  function linkBtns(p, inCard) {
    const out = [];
    const a = (href, cls, ic, t) => out.push(`<a class="lk ${cls}" href="${esc(href)}" target="_blank" rel="noopener" data-stop>${ic ? `<span class="ms">${ic}</span>` : ""}${t}</a>`);
    if (p.videos.length) out.push(`<button class="lk vid" data-video="${esc(p.name)}" data-stop><span class="ms">play_arrow</span>播放${p.videos.length > 1 ? " " + p.videos.length : ""}</button>`);
    if (p.live) a(p.live, "web", "language", "線上版");
    if (p.apple) a(p.apple, "app", "phone_iphone", "App Store");
    if (p.play) a(p.play, "play", "shop", "Google Play");
    if (p.download) a(p.download, "dl", "download", p.rel.tag ? esc(p.rel.tag) : "下載");
    if (!inCard || out.length < 4) a(p.url, "", "code", "GitHub");
    return out.join("");
  }

  function plats(p) {
    return D.platforms.map(x => { const v = p.platforms[x.code]; const s = v ? v.status : 0; if (s === 9) return "";
      return `<span class="pl s${s}" title="${esc(x.name)}：${esc(D.status_names[s] || "")}${v && v.version ? " " + esc(v.version) : ""}">${PL_SHORT[x.code] || x.code}</span>`; }).join("");
  }

  function avatar(p) {
    if (p.icon) return `<div class="av"><img src="${p.icon}" alt="" loading="lazy"></div>`;
    const t = toneOf(p);
    if (p.symbol) return `<div class="av" style="background:var(--t-${t});color:var(--f-${t})"><span class="ms" style="font-size:24px">${esc(p.symbol)}</span></div>`;
    return `<div class="av" style="background:var(--t-${t});color:var(--f-${t})">${esc([...p.title.replace(/^[^\p{L}\p{N}]+/u, "") || p.name][0] || "?")}</div>`;
  }

  function card(p) {
    const cats = p.cats.map(catOf).filter(Boolean);
    const tags = cats.map(c => `<span class="tag" style="background:${c.color}22;color:${c.color}"><span class="dot" style="background:${c.color};margin-right:2px"></span>${esc(c.name)}</span>`);
    if (p.language) tags.push(`<span class="tag"><span class="ms">code</span>${esc(p.language)}</span>`);
    if (p.stars) tags.push(`<span class="tag"><span class="ms">star</span>${p.stars}</span>`);
    if (p.archived) tags.push(`<span class="tag">已封存</span>`);
    if (p.fork) tags.push(`<span class="tag">Fork</span>`);
    return `<article class="pcard" tabindex="0" data-n="${esc(p.name)}" aria-label="${esc(p.title)}">
      <div class="ph">${avatar(p)}
        <div class="pt"><h3>${esc(p.title)}</h3><div class="nm">${esc(p.name)}</div></div></div>
      <p class="desc">${esc(p.description || "（沒有說明）")}</p>
      <div class="tags">${tags.join("")}</div>
      <div class="plats">${plats(p)}</div>
      <div class="links">${linkBtns(p, true)}</div>
      <div class="foot"><span>更新 ${day(p.pushed)}</span><span>${p.rel.published ? "發佈 " + day(p.rel.published) : ""}</span></div>
    </article>`;
  }

  function matrix(arr) {
    return `<div class="tblwrap"><table><thead><tr><th>專案</th>${D.platforms.map(x => `<th>${esc(x.name)}</th>`).join("")}<th>最新版本</th></tr></thead><tbody>` +
      arr.map(p => `<tr><td class="t" data-n="${esc(p.name)}"><b>${esc(p.title)}</b><span>${esc(p.name)}</span></td>` +
        D.platforms.map(x => { const v = p.platforms[x.code]; const s = v ? v.status : 0;
          return `<td>${s ? `<span class="st s${s}">${esc(D.status_names[s])}</span>` : `<span class="st s0">—</span>`}${v && v.version ? ` <small>${esc(v.version)}</small>` : ""}</td>`; }).join("") +
        `<td>${p.rel.tag ? esc(p.rel.tag) : ""}</td></tr>`).join("") + `</tbody></table></div>`;
  }

  function render() {
    try { sessionStorage.setItem("zp-state", JSON.stringify(state)); } catch (e) {}
    renderFilters(); renderTabs();
    const arr = visible();
    $("count").textContent = `顯示 ${arr.length} 個專案` + (arr.length !== D.projects.length ? `（共 ${D.projects.length} 個）` : "");
    if (!arr.length) { $("list").innerHTML = `<div class="empty"><span class="ms" style="font-size:48px">search_off</span><p>沒有符合條件的專案</p></div>`; return; }
    $("list").innerHTML = view === "cards" ? `<div class="grid">${arr.map(card).join("")}</div>` : matrix(arr);
  }

  // ------------------------------------------------------------ 明細
  async function loadReadmes() {
    if (readmes) return readmes;
    try { readmes = await fetch("../data/readmes.json", {cache: "no-cache"}).then(r => r.json()); } catch (e) { readmes = {}; }
    return readmes;
  }
  function readmeHtml(p, md) {
    const full = p.full_name || ("" + D.owner + "/" + p.name);
    md = md.replace(/^[ \t]*(https:\/\/github\.com\/user-attachments\/assets\/[\w-]+)[ \t]*$/gm, '<video controls preload="metadata" src="$1"></video>');
    let html = DOMPurify.sanitize(marked.parse(md, {gfm: true}), {ADD_TAGS: ["video", "source"], ADD_ATTR: ["controls", "preload", "target"]});
    const box = document.createElement("div"); box.innerHTML = html;
    const abs = (u, raw) => { if (!u || /^(https?:|mailto:|data:|#)/i.test(u)) return u; u = u.replace(/^\.?\//, "");
      return raw ? `https://raw.githubusercontent.com/${full}/HEAD/${u}` : `https://github.com/${full}/blob/HEAD/${u}`; };
    box.querySelectorAll("img[src],video[src],source[src]").forEach(el => el.setAttribute("src", abs(el.getAttribute("src"), true)));
    box.querySelectorAll("a[href]").forEach(el => { el.setAttribute("href", abs(el.getAttribute("href"), false)); el.target = "_blank"; el.rel = "noopener"; });
    return box.innerHTML;
  }
  function videosHtml(p) {
    return `<div class="vids">` + p.videos.map((u, i) => { const y = ytid(u), list = (u.match(/[?&]list=([\w-]+)/) || [])[1];
      const direct = /user-attachments\/assets\/|\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(u);
      const el = y ? `<iframe src="https://www.youtube-nocookie.com/embed/${y}" title="${esc(vname(u, i))}" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`
                   : list ? `<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=${list}" title="播放清單" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`
                   : direct ? `<video controls preload="metadata" src="${esc(u)}"></video>`
                   : `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener"><span class="ms">open_in_new</span>開啟影片網頁</a>`;
      return `<div>${el}<div class="cap"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(vname(u, i))}</a></div></div>`; }).join("") + `</div>`;
  }
  async function open(name, focusVideo) {
    const p = D.projects.find(x => x.name === name); if (!p) return;
    const dlg = $("dlg");
    const cats = p.cats.map(catOf).filter(Boolean).map(c => c.name).join("、");
    const info = [["專案名稱", `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.full_name || p.name)}</a>`],
      ["說明", esc(p.description)], ["分類", esc(cats || "未分類")], ["語言", esc(p.language)],
      ["主題標籤", esc(p.topics.join("、"))], ["星星／Fork", `${p.stars} ／ ${p.forks}`], ["最後更新", day(p.pushed)],
      ["最新版本", p.rel.tag ? `<a href="${esc(p.rel.url)}" target="_blank" rel="noopener">${esc(p.rel.tag)}</a>${p.rel.published ? "（" + day(p.rel.published) + "）" : ""}` : "尚未發佈"],
      ["首頁", p.homepage ? `<a href="${esc(p.homepage)}" target="_blank" rel="noopener">${esc(p.homepage)}</a>` : ""]].filter(r => r[1]);
    const ptable = `<table class="ptable"><thead><tr><th>平台</th><th>狀態</th><th>版本</th></tr></thead><tbody>` +
      D.platforms.map(x => { const v = p.platforms[x.code] || {status: 0}; return `<tr><td>${esc(x.name)}</td><td><span class="st s${v.status}">${esc(D.status_names[v.status] || "未定")}</span></td><td>${esc(v.version || "")}</td></tr>`; }).join("") + `</tbody></table>`;
    const assets = p.rel.assets.length ? `<div class="assets">` + p.rel.assets.map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener"><b>${esc(a.name)}</b><span>${a.size ? (a.size / 1048576).toFixed(1) + " MB" : ""}</span></a>`).join("") + `</div>` : "";
    dlg.innerHTML = `<div class="dh">${avatar(p)}<div style="flex:1;min-width:0"><h2 id="dTitle">${esc(p.title)}</h2><div class="nm">${esc(p.name)}</div></div>
        <button class="xbtn" id="dClose" aria-label="關閉"><span class="ms">close</span></button></div>
      <div class="db">
        <div class="links">${linkBtns(p, false)}</div>
        ${p.videos.length ? `<section id="dVid"><h4>播放媒體</h4>${videosHtml(p)}</section>` : ""}
        <section><h4>專案資訊</h4><dl class="kv">${info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></section>
        <section><h4>平台進度</h4>${ptable}</section>
        ${assets ? `<section><h4>下載檔案（${esc(p.rel.tag)}）</h4>${assets}</section>` : ""}
        <section><h4>README</h4><div class="readme" id="dReadme">${p.has_readme ? "載入中…" : "（沒有 README）"}</div></section>
      </div>`;
    dlg.querySelectorAll("[data-video]").forEach(b => b.onclick = () => { const v = $("dVid"); v && v.scrollIntoView({behavior: "smooth"}); const m = v && v.querySelector("video"); m && m.play().catch(() => {}); });
    $("dClose").onclick = () => dlg.close();
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
    if (history.replaceState) history.replaceState(null, "", "#p=" + encodeURIComponent(name));
    if (focusVideo) setTimeout(() => { const v = $("dVid"); v && v.scrollIntoView(); const m = v && v.querySelector("video"); m && m.play().catch(() => {}); }, 60);
    if (p.has_readme) {
      const r = await loadReadmes();
      const el = $("dReadme"); if (!el || $("dTitle").textContent !== p.title) return;
      el.innerHTML = r[p.name] ? readmeHtml(p, r[p.name]) : "（README 載入失敗）";
    }
  }
  $("dlg").addEventListener("close", () => { if (history.replaceState) history.replaceState(null, "", location.pathname + location.search); });
  $("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

  $("list").addEventListener("click", e => {
    const v = e.target.closest("[data-video]"); if (v) { e.preventDefault(); open(v.dataset.video, true); return; }
    if (e.target.closest("[data-stop]")) return;
    const c = e.target.closest("[data-n]"); if (c) open(c.dataset.n);
  });
  $("list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".pcard")) open(e.target.dataset.n); });
  let qt; $("q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; render(); }, 150); };
  $("sort").onchange = e => { state.sort = e.target.value; render(); };
  const setView = v => { view = v; $("vCards").setAttribute("aria-pressed", v === "cards"); $("vMatrix").setAttribute("aria-pressed", v === "matrix"); render(); };
  $("vCards").onclick = () => setView("cards"); $("vMatrix").onclick = () => setView("matrix");

  // ------------------------------------------------------------ 即時更新（GitHub 公開 API，不需登入，每小時 60 次）
  $("refresh").onclick = async () => {
    const btn = $("refresh"); btn.disabled = true; btn.style.opacity = .6;
    try {
      let all = [];
      for (let page = 1; page <= 5; page++) {
        const r = await fetch(`https://api.github.com/users/${encodeURIComponent(D.owner)}/repos?per_page=100&page=${page}&type=owner&sort=pushed`);
        if (r.status === 403 || r.status === 429) throw new Error("GitHub 查詢次數暫時用完，請稍後再試");
        if (!r.ok) throw new Error("GitHub 回應 " + r.status);
        const lst = await r.json(); all = all.concat(lst); if (lst.length < 100) break;
      }
      let added = 0;
      const map = new Map(D.projects.map(p => [p.name, p]));
      for (const r of all) {
        if (r.private) continue;
        const pushed = r.pushed_at ? new Date(new Date(r.pushed_at).getTime() + 8 * 3600e3).toISOString().slice(0, 16) : "";
        let p = map.get(r.name);
        if (!p) {
          p = {name: r.name, full_name: r.full_name, url: r.html_url, title: r.name, heading: "", description: "", stars: 0, forks: 0, language: "",
               topics: [], homepage: "", pushed: "", fork: !!r.fork, archived: false, status: "", rel: {tag: "", url: "", published: "", assets: []},
               apple: "", play: "", live: "", videos: [], download: "", cats: [], platforms: {}, has_readme: false};
          D.projects.push(p); map.set(r.name, p); added++;
        }
        const upd = {description: r.description || "", stars: r.stargazers_count || 0, forks: r.forks_count || 0, language: r.language || "",
                     topics: r.topics || [], homepage: r.homepage || "", pushed, archived: !!r.archived};
        if (upd.homepage && /^https?:\/\//.test(upd.homepage) && !p.live) upd.live = upd.homepage;
        for (const k in upd) p[k] = upd[k];
      }
      kpis(); render();
      toast(`已從 GitHub 更新：${all.length} 個專案${added ? "，新增 " + added : ""}`);
    } catch (e) { toast("即時更新失敗：" + e.message); }
    btn.disabled = false; btn.style.opacity = "";
  };

  // ------------------------------------------------------------ 載入
  fetch("../data/projects.json", {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    D = d;
    $("who").textContent = `${d.team ? d.team + " · " : ""}github.com/${d.owner} · ${d.projects.length} 個公開專案`;
    $("gen").textContent = "資料時間 " + d.generated.replace("T", " ").slice(0, 16);
    $("q").value = state.q; $("sort").value = state.sort;
    kpis(); render();
    const m = location.hash.match(/^#p=(.+)$/); if (m) open(decodeURIComponent(m[1]));
  }).catch(() => { $("list").innerHTML = `<div class="empty"><span class="ms" style="font-size:48px">cloud_off</span><p>資料載入失敗，請重新整理。</p></div>`; $("who").textContent = ""; });
})();
</script>
</body>
</html>
